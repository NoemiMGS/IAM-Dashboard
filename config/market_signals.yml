# Modul 1: branchenweite Marktsignale (KEIN Kundenbezug).
#
# Statt konkreter Zielkunden werden generische Themen-/Ereigniskategorien über
# Google News RSS beobachtet - z.B. CISO-Wechsel allgemein, Sicherheitsvorfälle
# in der DACH-Region, IAM/IGA-Ausschreibungen. Es wird nirgends nach einem
# bestimmten Unternehmensnamen gesucht oder gefiltert.
#
# "critical: true" markiert Kategorien, deren Treffer per E-Mail-Alert
# versendet werden.

signal_categories:
  - name: "CISO-/Sicherheitsverantwortliche-Wechsel"
    query: "\"neuer CISO\" OR \"Chief Information Security Officer\" Deutschland"
    critical: false

  - name: "Sicherheitsvorfall / Datenleck"
    query: "Sicherheitsvorfall OR Datenleck OR Cyberangriff Unternehmen Deutschland"
    critical: true

  - name: "DSGVO-Bußgeld"
    query: "DSGVO Bußgeld verhängt"
    critical: true

  - name: "NIS2-Betroffenheit"
    query: "NIS2 Betroffenheit Unternehmen"
    critical: false

  - name: "IAM/IGA-Ausschreibung"
    query: "Ausschreibung \"Identity and Access Management\" OR IAM OR IGA"
    critical: false

  - name: "PAM-Vorfall / Schwachstelle"
    query: "\"Privileged Access Management\" Vorfall OR Schwachstelle"
    critical: false

  - name: "KRITIS-Vorfall"
    query: "KRITIS Cyberangriff OR Sicherheitsvorfall"
    critical: true
